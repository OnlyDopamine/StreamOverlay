<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
			<title>Stream Overlay</title>

			<link rel="preconnect" href="https://fonts.googleapis.com">
				<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
					<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;700&display=swap" rel="stylesheet">

						<style>
							* { margin: 0; padding: 0; box-sizing: border-box; }
							body { overflow: hidden; background-color: transparent; }

							/* ─── COMMUNITY QUESTION PANEL (unchanged) ─── */
							.question-panel {
							position: absolute;
							top: 20px; left: 20px;
							width: 1000px; height: 260px;
							background-image: url('background.png');
							background-size: contain;
							background-repeat: no-repeat;
							transition: opacity 0.5s ease;
							opacity: 0;
							}
							.dynamic-content {
							display: grid;
							grid-template-columns: 80px 1fr;
							grid-template-rows: auto auto;
							gap: 15px;
							width: 1000px;
							padding-left: 60px; padding-right: 120px; padding-top: 45px;
							}
							.icon-display {
							grid-area: 1 / 1 / 2 / 2;
							width: 70px; height: 70px;
							justify-self: center; align-self: center;
							}
							.username-display {
							grid-area: 1 / 2 / 2 / 3;
							font-family: 'Raleway', sans-serif;
							font-size: 34px; font-weight: 700;
							color: #E6BF6B;
							text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
							align-self: center; text-transform: uppercase;
							}
							.question-text-display {
							grid-area: 2 / 2 / 3 / 3;
							font-family: 'Raleway', sans-serif;
							font-weight: 400; color: #E6BF6B;
							text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
							align-self: flex-start; text-transform: uppercase;
							max-width: 90%; word-wrap: break-word; overflow-wrap: break-word;
							height: 110px; overflow: hidden;
							}

						</style>
					</head>
	<body>

		<div class="question-panel" id="main-panel">
			<div class="dynamic-content">
				<img id="icon-display" class="icon-display" src="" alt="Icon">
					<div id="username-display" class="username-display">@Username</div>
					<div id="question-text-display" class="question-text-display">Question text will load here.</div>
				</div>
		</div>

		<script type="module">
			import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
			import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
			// onValue still used for communityQuestion below

			const firebaseConfig = {
			apiKey: "AIzaSyA3Yc9g3XB7FPbwaimfyMwg76dRchmu92w",
			authDomain: "streamoverlay-84cd1.firebaseapp.com",
			databaseURL: "https://streamoverlay-84cd1-default-rtdb.europe-west1.firebasedatabase.app/",
			projectId: "streamoverlay-84cd1",
			storageBucket: "streamoverlay-84cd1.firebasestorage.app",
			messagingSenderId: "293942876995",
			appId: "1:293942876995:web:024fc614dbfce900fdadf6"
			};

			const app = initializeApp(firebaseConfig);
			const db  = getDatabase(app);

			/* ── Scale the 2560×1440 root to fit the actual viewport ── */
			function scaleRoot() {
			const scaleX = window.innerWidth  / 2560;
			const scaleY = window.innerHeight / 1440;
			const scale  = Math.min(scaleX, scaleY);
			document.getElementById('lb-scale-root').style.transform = `scale(${scale})`;
			}
			scaleRoot();
			window.addEventListener('resize', scaleRoot);

			/* ── Community Question (unchanged) ── */
			let hideTimeout;
			onValue(ref(db, 'communityQuestion'), (snapshot) => {
			const data = snapshot.val();
			if (!data) return;

			document.getElementById('username-display').innerText = data.username;
			document.getElementById('icon-display').src = data.icon;
			const qEl = document.getElementById('question-text-display');
			qEl.innerText = data.text;

			let sz = 28, min = 14;
			qEl.style.fontSize = sz + 'px';
			while (qEl.scrollHeight > qEl.clientHeight && sz > min) {
			sz--;
			qEl.style.fontSize = sz + 'px';
			}

			const panel = document.getElementById('main-panel');
			if (data.username && data.text) {
			panel.style.opacity = '1';
			if (hideTimeout) clearTimeout(hideTimeout);
			hideTimeout = setTimeout(() => { panel.style.opacity = '0'; }, (data.duration || 15) * 1000);
			} else {
			panel.style.opacity = '0';
			}
			});

		</script>
	</body>
</html>
